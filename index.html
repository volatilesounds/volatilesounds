<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>VolatileSounds Simulations</title>

  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: sans-serif;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
      padding: 20px;
    }

    .sim-cell {
      position: relative;
      width: 100%;
      height: 240px;
      border: 1px solid #333;
      overflow: hidden;
    }

    .sim-title {
      position: absolute;
      top: 6px;
      left: 6px;
      background: rgba(0,0,0,0.6);
      padding: 4px 8px;
      font-size: 14px;
      z-index: 2;
    }

    .sim-mount {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: -1; /* behind text */
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.8s ease-in-out;
    }

    .sim-mount.active {
      opacity: 1;
    }
  </style>
</head>

<body>

<div class="grid" id="sim-grid"></div>

<script>
// ------------------------------------------------------------------
// List your simulation folders here
// ------------------------------------------------------------------
const simulations = [
  "sim-temp"
];

// ------------------------------------------------------------------
// Convert sim name → PascalCase mount function name
// sim-temp → SimTemp → mountSimTempApp
// ------------------------------------------------------------------
function normalizePascalCaseName(name) {
  return name
    .replace(/[^a-zA-Z0-9]/g, " ")
    .split(" ")
    .filter(Boolean)
    .map(w => w[0].toUpperCase() + w.slice(1))
    .join("");
}

const grid = document.getElementById("sim-grid");

// ------------------------------------------------------------------
// For each simulation, create cell + mount container + load manifest
// ------------------------------------------------------------------
simulations.forEach((simName, index) => {
  const pretty = normalizePascalCaseName(simName);

  // Create DOM elements
  const cell = document.createElement("div");
  cell.className = "sim-cell " + simName;

  const label = document.createElement("div");
  label.className = "sim-title";
  label.textContent = simName;

  const mount = document.createElement("div");
  mount.className = "sim-mount";
  mount.id = `vsounds-render-${simName}-${index}`;

  cell.appendChild(label);
  cell.appendChild(mount);
  grid.appendChild(cell);

  const basePath = "./simulations";

  // ------------------------------------------------------------------
  // Fetch manifest.json for this simulation
  // ------------------------------------------------------------------
  fetch(`${basePath}/${simName}/manifest.json`)
    .then(r => r.json())
    .then(manifest => {
      const entry = manifest["index.html"];
      if (!entry) {
        console.error(`manifest.json missing 'index.html' entry for ${simName}`);
        return;
      }

      const jsFile = entry.file;         // assets/index.[hash].js
      const cssFile = entry.css?.[0];    // assets/index.[hash].css

      // Load CSS
      if (cssFile) {
        const css = document.createElement("link");
        css.rel = "stylesheet";
        css.href = `${basePath}/${simName}/${cssFile}`;
        document.head.appendChild(css);
      }

      // Load JS
      const js = document.createElement("script");
      js.src = `${basePath}/${simName}/${jsFile}`;
      js.onload = () => {
        const fnName = "mount" + pretty + "App";

        if (typeof window[fnName] === "function") {
          window[fnName](mount);
          mount.classList.add("active");
        } else {
          console.warn(`Mount function missing: window.${fnName}`);
        }
      };

      js.onerror = () => {
        console.error("Failed to load", js.src);
      };

      document.body.appendChild(js);
    })
    .catch(err => {
      console.error(`Error loading manifest for ${simName}`, err);
    });
});
</script>

</body>
</html>
