<head>

<body>
<div id="vsounds-render"></div>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    const container = document.getElementById("vsounds-render");

    // your app name from the injected global
    const name = __APP_NAME__;  
    const fnName = "mount" + __APP_NAME_PASCAL__ + "App";

    const mountFn = window[fnName];
    if (typeof mountFn === "function") {
      mountFn(container);
    } else {
      console.error("Mount function not found:", fnName);
    }
  });
</script>

</body>
